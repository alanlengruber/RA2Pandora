# Sobrescreve o retroarch.cfg de fabrica (/usr/retroarch/retroarch.cfg)
# para o RetroArch novo. Os mapeamentos de controle vem do config de fabrica.

# Video: driver "drm" (plano de video, sem GPU) com os patches de
# patches/retroarch. Roda na velocidade real, mas nao desenha texto.
# O GL em thread tambem roda na velocidade real e desenha texto (teste 14),
# mas deu problemas nos jogos verticais (teste 15); fica em avaliacao.
video_driver = "drm"
video_context_driver = "kms"
video_fullscreen = "true"
video_threaded = "false"
video_hard_sync = "false"
video_vsync = "true"
video_smooth = "false"
video_refresh_rate = "64.516129"

# Preenche a tela inteira. O config de fabrica usa 23 (viewport 1280x720),
# que corta a imagem na saida 384x224 da placa.
aspect_ratio_index = "24"
video_aspect_ratio_auto = "false"
video_scale_integer = "false"

# Jogos verticais: o RetroArch gira a imagem. A proporcao deles vem do
# vertical.cfg, que o run.sh aplica aos jogos de verticais.txt.
video_allow_rotate = "true"

# Avisos (como os de conquista) no alto da tela: o driver drm desenha a
# faixa em cima quando este valor e 0.5 ou mais, e embaixo quando e menor.
video_message_pos_y = "0.95"

# O config de fabrica liga contador de quadros e estatisticas; com o GL eles
# aparecem na tela (e o painel de estatisticas custa CPU).
fps_show = "false"
framecount_show = "false"
statistics_show = "false"

menu_driver = "rgui"

input_driver = "udev"
input_joypad_driver = "udev"

# Audio: o codec so toca direito em 16 bits. "pandora" e definido em
# pandora-ra/.asoundrc (16 bits + volume da placa).
audio_driver = "alsathread"
audio_device = "pandora"
audio_out_rate = "44100"
audio_sync = "true"

# Moedas: o pandora-coin aperta o Select do jogador 1 por aqui.
network_remote_enable = "true"
network_remote_enable_user_p1 = "true"
network_remote_base_port = "55400"

# Sair do jogo: segurar Start por 2 s (como no Pandora original).
# 7 = INPUT_COMBO_HOLD_START. A tecla "Set" (0) tambem sai, se existir no painel.
input_quit_gamepad_combo = "7"
quit_press_twice = "false"
input_exit_emulator = "num0"
input_reset = "nul"

# Usa pandora-ra/core-options.cfg (escrito pelo run.sh) para todos os cores,
# em vez de um .opt por core.
global_core_options = "true"

config_save_on_exit = "false"
libretro_log_level = "1"
log_verbosity = "true"
frontend_log_level = "1"

# Conquistas desligadas por padrao; o conta.cfg liga (ver conta.cfg.exemplo).
# Com o servidor proprio, o RetroArch pede tudo ao relay local.
cheevos_enable = "false"
cheevos_custom_host = "http://127.0.0.1:8080"
cheevos_hardcore_mode_enable = "true"
cheevos_badges_enable = "false"
